```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OVRESSA</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>
        <h1>OVRESSA</h1>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="Produits.html">Produits</a>
            <a href="Homme.html">Homme</a>
            <a href="Femme.html">Femme</a>
            <a href="Contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="bienvenue">
            <h2>Contactez-nous</h2>
            <p>Nous sommes à votre disposition pour répondre à vos questions.</p>
        </section>

        <section class="contact">

            <form action="#" method="post">

                <fieldset>
                    <legend>Formulaire de contact</legend>

                    <label for="nom">Nom complet :</label>
                    <input type="text" id="nom" name="nom"
                           placeholder="Entrez votre nom" required>

                    <label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email"
                           placeholder="Entrez votre e-mail" required>

                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone"
                           placeholder="Votre numéro de téléphone">

                    <label for="sujet">Sujet :</label>
                    <select id="sujet" name="sujet">
                        <option value="">Choisir un sujet</option>
                        <option value="commande">Commande</option>
                        <option value="livraison">Livraison</option>
                        <option value="produit">Information sur un produit</option>
                        <option value="autre">Autre</option>
                    </select>

                    <label for="message">Votre message :</label>
                    <textarea id="message" name="message"
                              rows="6" placeholder="Écrivez votre message..."
                              required></textarea>

                    <button type="submit">Envoyer</button>

                </fieldset>

            </form>

        </section>
    </main>

    <footer>
        <p>© 2026 OVRESSA - Tous droits réservés</p>
        <p>Livraison disponible partout en Tunisie</p>
    </footer>
    <script src="script.js"></script>

</body>
</html>
```
